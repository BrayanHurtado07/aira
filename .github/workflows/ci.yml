name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Verificar formato (gofmt, informativo)
        run: |
          sin_formato=$(gofmt -l .)
          if [ -n "$sin_formato" ]; then
            echo "::warning::Archivos sin formatear (corrige con 'gofmt -w .'):"
            echo "$sin_formato"
          else
            echo "Todo formateado ✓"
          fi

      - name: go vet
        run: go vet ./...

      - name: Compilar
        run: go build ./...

      - name: Pruebas
        run: go test ./...
